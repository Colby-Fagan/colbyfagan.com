<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colby Fagan</title>
  <meta name="description" content="Colby Fagan works on biosecurity and is building ASTRAL, biological misuse detection for AI chat logs.">
  <meta property="og:title" content="Colby Fagan">
  <meta property="og:description" content="Biosecurity. Building ASTRAL.">
  <meta property="og:image" content="https://colbyfagan.com/headshot.jpg">
  <link rel="canonical" href="https://colbyfagan.com/">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #faf9f6;
      --text: #1b1b19;
      --muted: #6a6862;
      --line: #e3e0d8;
      --accent: #1d5c47;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131412;
        --text: #eceae4;
        --muted: #9b988f;
        --line: #2a2b27;
        --accent: #8ed1b4;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 3rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.5;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 26rem;
    }

    .headshot {
      display: block;
      width: 10rem;
      height: 10rem;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      object-fit: cover;
    }

    h1, h2 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.15;
    }

    section {
      margin-top: 1.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--line);
    }

    h2 {
      font-size: 1.375rem;
      line-height: 1.2;
      margin-bottom: 0.625rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .project {
      text-wrap: balance;
      display: block;
    }

    .project .title {
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.25em;
      transition: text-decoration-color 0.15s;
    }

    .project .where {
      display: block;
      margin-top: 0.25rem;
      color: var(--accent);
      font-size: 0.9375rem;
    }

    .project:hover .title {
      text-decoration-color: var(--accent);
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 0.25rem;
      margin-top: 0.5rem;
    }

    .social a {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      color: var(--muted);
      transition: color 0.15s;
    }

    .social svg {
      width: 1.375rem;
      height: 1.375rem;
      fill: currentColor;
    }

    .social a:hover {
      color: var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <img class="headshot" src="headshot.jpg" width="640" height="640" alt="Colby Fagan">
    <h1>Colby Fagan</h1>

    <nav class="social" aria-label="Profiles">
      <a href="https://www.linkedin.com/in/colby-fagan/" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="https://x.com/Colby_fgn" aria-label="X" title="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
      </a>
    </nav>

    <section aria-labelledby="biosecurity">
      <h2 id="biosecurity">Biosecurity</h2>
      <a class="project" href="https://astral.detection.bio/">
        <span class="title">ASTRAL: biological misuse detection for AI chat logs</span>
        <span class="where">astral.detection.bio</span>
      </a>
    </section>

    <section aria-labelledby="for-fun">
      <h2 id="for-fun">For fun</h2>
      <a class="project" href="https://elegans.online/">
        <span class="title"><i>C. elegans</i> simulator</span>
        <span class="where">elegans.online</span>
      </a>
    </section>
  </main>
</body>
</html>
